<div class="ip-table-wrapper" [class.is-loading]="loading()">
  @if (loading()) {
    <div
      class="ip-table-loading-bar"
      role="progressbar"
      aria-label="Chargement des données..."
    ></div>
  }
  <div class="ip-table-scroll">
    <table class="ip-table">
      <ng-content></ng-content>
    </table>
  </div>
</div>
