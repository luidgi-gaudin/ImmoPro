@if (providers().length) {
  <div class="social-block">
    <div class="social-buttons">
      @for (provider of providers(); track provider.value) {
        <button
          type="button"
          class="social-button"
          [class.is-pending]="pending() === provider.value"
          [disabled]="disabled() || pending() !== null"
          (click)="choose(provider.value)"
        >
          @if (provider.value === 'google') {
            <svg class="social-mark" viewBox="0 0 18 18" aria-hidden="true">
              <path
                fill="#4285F4"
                d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z"
              />
              <path
                fill="#34A853"
                d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.94v2.33A9 9 0 0 0 9 18Z"
              />
              <path
                fill="#FBBC05"
                d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.94a9 9 0 0 0 0 8.1l3.03-2.33Z"
              />
              <path
                fill="#EA4335"
                d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .94 4.95l3.03 2.33C4.68 5.16 6.66 3.58 9 3.58Z"
              />
            </svg>
          } @else {
            <svg class="social-mark" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true">
              <path
                d="M12.66 9.55c-.02-1.93 1.58-2.86 1.65-2.9-.9-1.31-2.3-1.49-2.8-1.51-1.19-.12-2.32.7-2.93.7-.6 0-1.53-.68-2.52-.66-1.3.02-2.5.75-3.16 1.91-1.35 2.34-.34 5.8.97 7.7.64.93 1.4 1.97 2.4 1.93.96-.04 1.33-.62 2.49-.62s1.49.62 2.5.6c1.04-.02 1.69-.94 2.32-1.88.73-1.07 1.03-2.11 1.05-2.16-.02-.01-2.01-.77-2.03-3.06M10.8 3.3c.53-.64.89-1.53.79-2.42-.76.03-1.69.51-2.24 1.15-.49.56-.92 1.47-.8 2.33.85.07 1.72-.43 2.25-1.06"
              />
            </svg>
          }

          <span>{{ verb() }} {{ provider.label }}</span>
        </button>
      }
    </div>

    <div class="social-divider"><span>ou</span></div>
  </div>
}
