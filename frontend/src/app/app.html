<div class="app-shell" [class.has-chrome]="showChrome()">
  @if (showChrome()) {
    <app-sidebar />
    <div class="app-body">
      <app-topbar />
      <main class="app-content">
        <app-breadcrumb />
        <router-outlet />
      </main>
    </div>
    <app-global-search />
  } @else {
    <router-outlet />
  }
</div>

<!-- Hors du shell : le bandeau doit apparaître aussi bien sur la landing et les
     écrans de connexion que dans l'application, puisque le stockage local est
     utilisé dès la première visite. -->
<app-cookie-banner />

<!-- Décide seule de son affichage : mobile, pages vitrines, hors bandeau cookies. -->
<app-sticky-cta />

<!-- Hôtes globaux, montés une seule fois : messages transitoires, demandes de
     confirmation et préavis d'expiration de session. Chacun ne rend quelque
     chose que lorsqu'il a de quoi afficher. -->
<app-toast-host />
<app-confirm-dialog />
<app-session-expiry />
