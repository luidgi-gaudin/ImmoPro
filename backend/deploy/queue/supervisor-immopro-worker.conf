; Ouvrier de file d'attente ImmoPro — configuration Supervisor.
;
; À copier dans /etc/supervisor/conf.d/, puis :
;
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status immopro-worker:*
;
; Pourquoi un superviseur plutôt qu'un simple `php artisan queue:work &` : un
; ouvrier finit toujours par s'arrêter — mémoire épuisée, base momentanément
; injoignable, `--max-time` atteint. Sans quelqu'un pour le relancer, les
; courriels cessent de partir et rien ne le signale. C'est exactement la panne
; que ce fichier existe pour éviter.

[program:immopro-worker]

; `queue:work` et non `queue:listen` : le second relance le framework à chaque
; tâche, ce qui est commode en développement — le code modifié est pris en
; compte sans redémarrer — mais coûte plusieurs dizaines de millisecondes par
; message. En production le code ne bouge pas entre deux déploiements.
;
; Contrepartie, et elle compte : `queue:work` garde le code en mémoire. Après
; chaque déploiement, il faut lancer `php artisan queue:restart`, sinon les
; ouvriers continuent d'exécuter l'ancienne version.
;
;   --tries=3      trois tentatives pour les tâches qui n'en fixent pas
;                  elles-mêmes. Le code à usage unique, lui, impose sa propre
;                  fenêtre : il cesse d'être réessayé dès qu'il expire, parce
;                  que livrer un code périmé ne rend service à personne.
;   --backoff=10   dix secondes entre deux tentatives, le temps qu'une panne
;                  passagère du serveur de messagerie se dissipe.
;   --max-time     l'ouvrier se termine au bout d'une heure et le superviseur
;                  le relance : c'est la parade la plus simple aux fuites de
;                  mémoire d'un processus de longue durée.
;   --sleep=1      une seconde d'attente quand la file est vide. Sur une file
;                  en base, c'est une requête par seconde et par ouvrier.
command=php /var/www/immopro/backend/artisan queue:work --tries=3 --backoff=10 --max-time=3600 --sleep=1

directory=/var/www/immopro/backend
user=www-data

autostart=true
autorestart=true

; Le superviseur ne doit pas considérer un arrêt volontaire comme un plantage :
; `--max-time` fait sortir l'ouvrier avec le code 0, et c'est normal.
stopwaitsecs=3600
exitcodes=0

; Deux ouvriers suffisent largement à ce volume : quelques codes à usage unique
; et quelques relances par jour. Les multiplier ne ferait qu'augmenter le
; nombre de requêtes d'attente sur la base.
numprocs=2
process_name=%(program_name)s_%(process_num)02d

redirect_stderr=true
stdout_logfile=/var/log/immopro/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
